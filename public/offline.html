<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Scriptum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-center;
            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .features {
            margin-top: 48px;
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .feature:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            font-size: 18px;
        }

        .feature-text {
            font-size: 14px;
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>

        <h1>Você está offline</h1>

        <p>
            Não foi possível conectar ao Scriptum.
            Verifique sua conexão com a internet e tente novamente.
        </p>

        <button onclick="window.location.reload()">
            🔄 Tentar Novamente
        </button>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">
                    <strong>Upload Paralelo</strong> - 8x mais rápido
                </div>
            </div>

            <div class="feature">
                <div class="feature-icon">🎯</div>
                <div class="feature-text">
                    <strong>MLX Whisper</strong> - Sincronização precisa
                </div>
            </div>

            <div class="feature">
                <div class="feature-icon">🌐</div>
                <div class="feature-text">
                    <strong>Tradução IA</strong> - Gemini powered
                </div>
            </div>

            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-text">
                    <strong>Mobile First</strong> - Otimizado para touch
                </div>
            </div>
        </div>
    </div>
</body>
</html>
